name: Automated EOD Market Intelligence Pipeline

on:
  schedule:
    # 3:45 PM IST (Monday - Friday) = 10:15 AM UTC
    - cron: '15 10 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  run-eod-pipeline:
    name: Fetch NSE EOD Bhavcopy & Update Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: '' # Pure standard library, no pip cache needed

      - name: Execute EOD Pipeline Script
        run: |
          python eod_pipeline.py

      - name: Verify Generated JSON Payload
        run: |
          if [ ! -f "data/market_summary.json" ]; then
            echo "::error ::data/market_summary.json was not generated!"
            exit 1
          fi
          echo "Market Summary Payload Size: $(du -h data/market_summary.json | cut -f1)"

      - name: Commit and Push Updated EOD Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market_summary.json
          if git diff --staged --quiet; then
            echo "No changes detected in data/market_summary.json. Skipping commit."
          else
            git commit -m "chore(data): auto-update EOD market intelligence [skip ci]"
            git push
          fi
