name: Daily NSE EOD Auto Ingestion

on:
  schedule:
    - cron: '30 11 * * 1-5'  # Every Monday to Friday at 5:00 PM IST (11:30 AM UTC)
  workflow_dispatch: {}           # Allows one-click manual run from GitHub Actions UI anytime

permissions:
  contents: write

jobs:
  daily-eod:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pandas requests numpy

      - name: Execute pipeline
        run: python eod_pipeline.py

      - name: Check for data changes and auto-commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || (git commit -m "chore(data): auto-update daily NSE EOD data [skip ci]" && git push origin main)
