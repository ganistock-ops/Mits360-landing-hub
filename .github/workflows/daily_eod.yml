name: Automated Daily NSE EOD Market Pipeline

on:
  schedule:
    # 5:00 PM IST (Monday - Friday) = 11:30 AM UTC
    - cron: '30 11 * * 1-5'
  workflow_dispatch: # Allows manual on-demand execution

permissions:
  contents: write

jobs:
  run-eod-pipeline:
    name: Fetch Official NSE EOD Bhavcopy & Refresh Market Data
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: Execute Ultra-Fast EOD Pipeline
        run: |
          python eod_pipeline.py

      - name: Verify Generated JSON Payloads
        run: |
          for f in data/market_summary.json data/advance_decline_data.json data/nifty_view_data.json data/banknifty_view_data.json; do
            if [ ! -f "$f" ]; then
              echo "::error ::Required payload $f was not generated!"
              exit 1
            fi
            echo "Payload $f: $(du -h $f | cut -f1)"
          done

      - name: Commit & Push Daily EOD Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No data changes detected. Skipping commit."
          else
            git commit -m "chore(data): auto-update daily NSE EOD data [skip ci]"
            git push origin main
          fi
