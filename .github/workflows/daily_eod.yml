name: Daily NSE EOD Auto Ingestion

on:
  schedule:
    - cron: '0 12 * * 1-5'
    - cron: '30 12 * * 1-5'
    - cron: '0 13 * * 1-5'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install pandas requests

      - name: Execute Ultra-Fast EOD Pipeline
        run: python eod_pipeline.py

      - name: Commit & Push Daily EOD Data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m 'auto: daily EOD update [skip ci]' && git push)
